# NOTE: not a Python package. uv uses this to manage the Python tools the
# development workflow needs (the pre-commit hook manager); the Nix dev shell
# runs `uv sync` and puts `.venv/bin` on PATH.
[project]
name = "uniflow-dev"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pre-commit~=4.7"]

[tool.uv]
package = false
